<!DOCTYPE html>
<html>

<head>
    <title>My Bookings</title>
    <link href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet"/>
</head>
<body class="page-body">
  <div class="dashboard-card full-width">
<h2>Edit booking for Room {{ booking.room_no }}</h2>

<form method="post" action="/edit-booking">
  <input type="hidden" name="booking_id" value="{{ booking._id }}">
  <input type="hidden" name="room_id" value="{{ booking.room_id }}">

  <div class="form-row">
    <div class="form-group">
  <label>Date</label>
  <input type="date" name="date" value="{{ booking.date }}" required>
</div>
<div class="form-group">
  <label>Start time</label>
  <input type="time" name="start_time" value="{{ booking.start_time }}" required>
  </div>
</div>
<div class="form-row">
  <div class="form-group">
    <label>End time</label>
    <input type="time" name="end_time" value="{{ booking.end_time }}" required>
  </div>

  <div class="form-group button-group">
    <label>&nbsp;</label>
    <div class="button-row">
      <button class="primary-button button" type="submit">Save changes</button>
      <button class="secondary-button button" type="button" onclick="window.history.back()">Cancel</button>
    </div>
  </div>
</div>

</form>
</div>
</body>
</html>
