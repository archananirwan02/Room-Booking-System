<!DOCTYPE html>
<html>
<head>
    <title>Bookings for {{ selected_date }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>

<body class="page-body">
<!-- Back button -->
<a href="/" class="back-link">← Back</a>
<h1 class="page-title">Bookings on {{ selected_date }}</h1>

{% if bookings|length == 0 %}
    <p class="information-message">No bookings were found for this day.</p>
{% else %}
<hr>
    <table class="table">
        <thead>
            <tr>
                <th>Room</th>
                <th>Date</th>
                <th>Start</th>
                <th>End</th>
                <th>User</th>
            </tr>
        </thead>

        <tbody>
            {% for b in bookings %}
            <tr>
                <td>{{ b.room_no }}</td>
                <td>{{ b.date }}</td>
                <td>{{ b.start_time }}</td>
                <td>{{ b.end_time }}</td>
                <td>{{ b.user_email }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endif %}

</body>
</html>
