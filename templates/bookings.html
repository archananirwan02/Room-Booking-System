<h1>My Bookings</h1>

<table>
    <tr>
        <th>Room</th>
        <th>Date</th>
        <th>Start Time</th>
        <th>End Time</th>
    </tr>

    {% for b in bookings %}
    <tr>
        <td>{{ b.room_no }}</td>
        <td>{{ b.date }}</td>
        <td>{{ b.start_time }}</td>
        <td>{{ b.end_time }}</td>
    </tr>
    {% endfor %}
</table>

<a href="/">Back</a>
