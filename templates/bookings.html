<!DOCTYPE html>
<html>

<head>
    <title>My Bookings</title>
    <link href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet"/>
</head>

<body class="page-body">
<h1 class="page-title">My Bookings</h1>

<table class="table">
    <tr>
        <th>Room</th>
        <th>Date</th>
        <th>Start Time</th>
        <th>End Time</th>
        <th colspan="2">Actions</th>
    </tr>

    {% for b in bookings %}
    <tr>
        <td>{{ b.room_no }}</td>
        <td>{{ b.date }}</td>
        <td>{{ b.start_time }}</td>
        <td>{{ b.end_time }}</td>
        <td>
            
            <form method="get" action="/edit-booking/{{ b._id }}">
                <button class="button edit-button" type="submit">Edit</button>
            </form>
        </td>
        <td>
            <form method="post" action="/delete-room-booking">
                <input type="hidden" name="booking_id" value="{{ b._id }}">
                <button class="button delete-button" type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% if success_message %}
    <p class="success-message">{{ success_message }}</p>
{% endif %}
    <div style="text-align: center;">
        <a class="hyperlink" href="/">Home</a>
    </div>
</body>
</html>
